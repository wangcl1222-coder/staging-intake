contract_version: PROJECT_INTAKE_V1
source_mode: interview_skill
project:
  name: Weekly meal planning notebook
  objective: Reduce weekday dinner decision time by producing a simple weekly meal outline from confirmed preferences and available ingredients.
  background: The user loses time deciding what to cook and may forget ingredients already at home.
  expected_value: Faster weekday meal planning with fewer unnecessary ingredient purchases.
scope:
  in_scope:
    - Capture available ingredients
    - Record preferred meals
    - Produce a weekly meal outline
  out_of_scope:
    - Grocery delivery
    - Nutrition or medical advice
requirements:
  functional:
    - The user can record available ingredients and meal preferences
    - The project can produce a weekly meal outline
  engineering: []
  performance:
    - The user can make a weekday dinner plan in under five minutes
constraints:
  hardware: []
  software: []
  budget: null
  schedule: null
  legal_or_policy: []
evidence:
  available:
    - The user wants less decision fatigue during weekday dinners
    - The user already keeps a rough ingredient list
  missing: []
unknowns:
  - Exact meal data format can be decided later
planning_directives:
  mode: MVP_FIRST
  reuse_first: true
  visible_result_first: true
  real_blocker_only: true
  build_new_last: true
  policy_ref: ai-engineering-control/docs/policies/PLANNER_POLICY.md
human_gates: []
acceptance:
  - The user can make a weekday dinner plan in under five minutes
deliverables:
  - A usable weekly meal planning MVP
existing_assets:
  - Existing rough ingredient list
data_characteristics:
  large_assets_expected: false
  sensitive_or_protected_data: false
  expected_runtime_data_types:
    - Ingredient list
    - Meal preferences
    - Weekly meal outline
recommended_first_milestone: Confirm a minimal usable planning flow with one household cook
intake_status: READY_FOR_HANDOFF
